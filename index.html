<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>老吴模拟器</title>
<style>
  :root{
    --bg1:#FFF6EA; --bg2:#FFE9D2; --ink:#3E3227; --ink2:#8A7A66;
    --cat:#F5A54A; --cat-d:#4A3428; --pink:#FFB6B0; --hot:#E8722D;
    --line:rgba(62,50,39,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font:15px/1.5 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink); background:var(--bg1);
    overflow:hidden; user-select:none; -webkit-user-select:none;
  }
  #app{height:100%;display:flex;flex-direction:column;max-width:1080px;margin:0 auto;padding:14px 18px 12px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{margin:0;font-size:22px;letter-spacing:.5px}
  h1 em{font-style:normal;color:var(--hot)}
  #stage{
    position:relative;flex:1;margin:12px 0;border-radius:18px;overflow:hidden;
    background:linear-gradient(180deg,#FFFBF4,#FFF1E0 60%,#FFE7CF);
    box-shadow:inset 0 0 0 1px rgba(62,50,39,.08),0 6px 20px rgba(180,140,90,.10);
    cursor:crosshair;touch-action:none;
  }
  #viz{position:absolute;inset:0;width:100%;height:100%;display:block}
    #catWrap{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);
    width:300px;pointer-events:none;isolation:isolate;
  }
  #cat{display:block;width:100%;height:auto;filter:drop-shadow(0 10px 18px rgba(120,80,40,.18))}
  #heatMask{                                  /* 红温: 把整只猫染红 */
    position:absolute;inset:0;background:#ff2a10;mix-blend-mode:color;opacity:0;
  }
  #steam{position:absolute;left:50%;top:-4px;transform:translateX(-50%);width:130px;height:76px;opacity:0}
  #steam i{
    position:absolute;bottom:0;width:15px;height:15px;border-radius:50%;
    background:rgba(255,95,60,.6);filter:blur(3px);animation:rise 2.1s linear infinite;
  }
  #steam i:nth-child(1){left:14%;animation-delay:0s}
  #steam i:nth-child(2){left:43%;animation-delay:.7s}
  #steam i:nth-child(3){left:72%;animation-delay:1.4s}
  @keyframes rise{
    0%{transform:translateY(12px) scale(.5);opacity:0}
    25%{opacity:.85}
    100%{transform:translateY(-48px) scale(1.7);opacity:0}
  }
  #idle{
    position:absolute;left:50%;bottom:14%;transform:translateX(-50%);
    font-size:13px;color:var(--ink2);pointer-events:none;transition:opacity .3s;
  }
  footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
  .ctl{display:flex;align-items:center;gap:6px}
  .seg{display:flex;background:#fff;border-radius:9px;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
  .seg button{
    border:0;background:transparent;padding:6px 10px;font:inherit;font-size:12px;color:var(--ink2);cursor:pointer;
  }
  .seg button.on{background:var(--hot);color:#fff}
  .tg{
    border:0;background:#fff;padding:6px 11px;border-radius:9px;font:inherit;font-size:12px;color:var(--ink2);
    cursor:pointer;box-shadow:inset 0 0 0 1px var(--line);
  }
  .tg.on{background:var(--hot);color:#fff;box-shadow:none}
  input[type=range]{width:96px;accent-color:var(--hot)}
  .spacer{flex:1}
  .foot-note{font-size:12px;color:var(--ink2);opacity:.8}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>老吴<em>模拟器</em></h1>
  </header>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const stage = $('#stage'), canvas = $('#viz'), ctx2d = canvas.getContext('2d');

  /* ---------- 变速变调 ---------- */
  // 采样通过 playbackRate 变调：0.5x 低沉慢放，2x 尖细快放，1x 是原声
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const RANGES = [
    { lo: 0.35, hi: 1.0 },   // 低沉
    { lo: 0.5,  hi: 2.0 },   // 标准
    { lo: 0.9,  hi: 3.0 }    // 尖叫
  ];
  let rangeIdx = 1;
  const rangeOf = () => RANGES[rangeIdx];
  const posToRate = t => { const r = rangeOf(); return r.lo * Math.pow(r.hi / r.lo, clamp(t, 0, 1)); };
  const STEPS = 16;            // 隐形键盘的刻度数（跨过时触发"咬字"颗粒）

  /* ---------- 音频引擎 ---------- */
  // 实时变调器：重叠相加(OLA)，只改音高不改速度
  const WORKLET = `
  class Pitcher extends AudioWorkletProcessor {
    static get parameterDescriptors() {
      return [{ name: 'shift', defaultValue: 1, minValue: 0.25, maxValue: 4, automationRate: 'k-rate' }];
    }
    constructor() {
      super();
      this.hop = 512;                       // 每次合成推进 512 个输出样本 (~11.6ms)
      this.N = 131072;
      this.mask = this.N - 1;
      this.buf = new Float32Array(this.N);
      this.acc = new Float32Array(this.hop * 2);

    if (!s) return;
    const r = stage.getBoundingClientRect();
    const t = (e.clientX - r.left) / r.width;
    const rate = posToRate(t), step = posToStep(t);
    s.v.setRate(rate);
    if (step !== s.step) { s.v.jaw(); s.step = step; }
    s.t = t; s.rate = rate; curEff = Math.log2(rate);
    pushTrail(t, curEff);
  }
  function up(e) {
    const s = voices.get(e.pointerId);
    if (!s) return;
    s.v.release();
    voices.delete(e.pointerId);
  }
  function pushTrail(t, eff) {
    trails.push({ t, eff, a: 1, on: true });
    if (trails.length > 900) trails.splice(0, 300);
  }

  stage.addEventListener('pointerdown', down);
  stage.addEventListener('pointermove', move);
  stage.addEventListener('pointerup', up);
  stage.addEventListener('pointercancel', up);
  stage.addEventListener('pointerleave', up);
  stage.addEventListener('contextmenu', e => e.preventDefault());
  // 兜底: 指针在窗口外松开、切标签页、失焦都要收声，避免一直响
  window.addEventListener('pointerup', up);
  window.addEventListener('pointercancel', up);
  const panic = () => { voices.forEach(v => v.v.release()); voices.clear(); };
  window.addEventListener('blur', panic);
  document.addEventListener('visibilitychange', () => { if (document.hidden) panic(); });

  /* ---------- 猫脸 ---------- */
  const cat = $('#cat'), catWrap = $('#catWrap'), heatMask = $('#heatMask'),
        steam = $('#steam');
  let faceLvl = 0, heatHold = 0;              // heatHold: 在高音区待久了慢慢升到 1
  let maskReady = false;
  function setupMask() {                      // 用猫图自身的透明通道当染色层的蒙版
    if (maskReady || !cat.naturalWidth) return;
    maskReady = true;
    const c = document.createElement('canvas');
    c.width = cat.naturalWidth; c.height = cat.naturalHeight;
    c.getContext('2d').drawImage(cat, 0, 0);
    const url = c.toDataURL('image/png');
    for (const k of ['maskImage', 'webkitMaskImage']) heatMask.style[k] = `url("${url}")`;
    for (const k of ['maskSize', 'webkitMaskSize']) heatMask.style[k] = '100% 100%';
  }
  function drawFace() {
    setupMask();
    const active = voices.size > 0;
    const target = active ? clamp((curEff + 1) / 2, 0, 1) : 0;
    faceLvl += ((active ? 0.35 + target * 0.65 : 0) - faceLvl) * 0.18;
    const hot = active && curEff > 0.32;      // 约 1.25x 以上就开始升温
    heatHold += ((hot ? 1 : 0) - heatHold) * (hot ? 0.024 : 0.03);   // 约 1.5 秒红温拉满
    const heat = heatHold;

    // 染色: 滑到高音区立刻泛红, 待久了继续加深
    const instant = active ? clamp((curEff - 0.25) * 1.6, 0, 1) * 0.35 : 0;
    heatMask.style.opacity = Math.min(instant + heat * 0.95, 1).toFixed(3);
    steam.style.opacity = clamp((heat - 0.25) * 1.7, 0, 1).toFixed(3);
    cat.style.filter =
      `drop-shadow(0 10px 20px rgba(255,${Math.round(95 - heat * 60)},${Math.round(65 - heat * 45)},${(0.18 + heat * 0.4).toFixed(2)}))` +
      ` saturate(${(1 + heat * 1.9).toFixed(2)}) hue-rotate(${(-heat * 24).toFixed(1)}deg) contrast(${(1 + heat * 0.14).toFixed(2)})`;

    // 抖动 + 急促起伏，越红温越癫
    const shake = active ? faceLvl * (0.6 + target * 2.4) + heat * heat * 6.5 : 0;
    const period = 90 - heat * 62;
    const pant = Math.sin(performance.now() / 110) * heat * 0.022;    // 喘
    catWrap.style.transform =
      `translate(-50%,-52%) scale(${(1 + heat * 0.05 + pant).toFixed(3)})` +
      ` rotate(${(Math.sin(performance.now() / period) * shake * 1.4).toFixed(2)}deg)` +
      ` translate(${(Math.random() * shake).toFixed(1)}px,${((Math.random() - .5) * shake).toFixed(1)}px)`;
  }

    /* ---------- 绘制 ---------- */
  let showGrid = false, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const r = stage.getBoundingClientRect();
    canvas.width = r.width * dpr; canvas.height = r.height * dpr;
  }
  window.addEventListener('resize', resize);
  resize();

  function draw() {
    try {
    const W = canvas.width, H = canvas.height, h = H / dpr;
    const kbH = 46 * dpr, plotH = H - kbH;
    ctx2d.clearRect(0, 0, W, H);

    const yOf = e => plotH - clamp((e + 1) / 2, 0, 1) * (plotH - 30 * dpr) - 15 * dpr;

    // 键盘条（隐形：默认只有极淡的刻度）
    const kbTop = plotH;
    ctx2d.fillStyle = showGrid ? 'rgba(255,255,255,.75)' : 'rgba(255,255,255,.35)';
    ctx2d.fillRect(0, kbTop, W, kbH);
    for (let i = 0; i <= STEPS; i++) {
      const x = i / STEPS * W;
      const isRoot = i % 4 === 0;
      ctx2d.strokeStyle = showGrid
        ? (isRoot ? 'rgba(232,114,45,.45)' : 'rgba(62,50,39,.16)')
        : (isRoot ? 'rgba(232,114,45,.13)' : 'rgba(62,50,39,.05)');
      ctx2d.lineWidth = (isRoot ? 2 : 1) * dpr;
      ctx2d.beginPath(); ctx2d.moveTo(x, kbTop + (isRoot ? 4 : 10) * dpr); ctx2d.lineTo(x, kbTop + kbH - 4 * dpr); ctx2d.stroke();
    }

    // 音高轨迹
    for (const p of trails) {
      if (!p.on) p.a -= 0.012; else p.a -= 0.006;
      if (p.a <= 0) continue;
      const x = p.t * W, y = yOf(p.eff);
      const heat = clamp((p.eff + 1) / 2, 0, 1);
      ctx2d.fillStyle = `rgba(${232 + heat * 10},${114 - heat * 40},${45 - heat * 30},${(p.a * 0.5).toFixed(3)})`;
      ctx2d.beginPath(); ctx2d.arc(x, y, (2 + heat * 3) * dpr, 0, 6.283); ctx2d.fill();
    }
    while (trails.length && trails[0].a <= 0) trails.shift();

    // 活跃触点
    for (const [, s] of voices) {
      const eff = Math.log2(s.rate), x = s.t * W;
      const heat = clamp((eff + 1) / 2, 0, 1);
      const g = ctx2d.createRadialGradient(x, yOf(eff), 0, x, yOf(eff), 46 * dpr);
      g.addColorStop(0, `rgba(255,170,80,${0.55 + heat * 0.3})`);
      g.addColorStop(1, 'rgba(255,170,80,0)');
      ctx2d.fillStyle = g;
      ctx2d.beginPath(); ctx2d.arc(x, yOf(eff), 46 * dpr, 0, 6.283); ctx2d.fill();
      ctx2d.fillStyle = '#E8722D';
      ctx2d.beginPath(); ctx2d.arc(x, yOf(eff), 5 * dpr, 0, 6.283); ctx2d.fill();
      ctx2d.fillRect(x - 1.5 * dpr, kbTop, 3 * dpr, kbH);
    }

    $('#idle').style.opacity = voices.size ? 0 : 1;
    drawFace();
    } catch (err) { /* 单帧出错也不能让循环停摆 */ }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  /* ---------- 控件 ---------- */
  $('#rangeSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    rangeIdx = +b.dataset.r;
    [...e.currentTarget.children].forEach(x => x.classList.toggle('on', x === b));
  });
  $('#reverbBtn').addEventListener('click', e => {
    reverbOn = !reverbOn; e.currentTarget.classList.toggle('on', reverbOn);
    if (ac) wetBus.gain.setTargetAtTime(reverbOn ? 0.5 : 0, ac.currentTime, 0.05);
  });
  $('#gridBtn').addEventListener('click', e => {
    showGrid = !showGrid; e.currentTarget.classList.toggle('on', showGrid);
  });
  $('#vol').addEventListener('input', e => {
    if (ac) master.gain.setTargetAtTime(e.target.value / 100 * 0.8, ac.currentTime, 0.02);
  });

  initAudio();   // 提前把采样和变调模块装好，第一次按下就能直接出声
})();
</script>
</body>
</html>
